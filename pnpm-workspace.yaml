packages:
  - packages/*

overrides:
  # oxfmt 0.59.0 pins a worker pool affected by GHSA-85c8-ppgw-ccpr.
  "oxfmt@0.59.0>tinypool": 2.1.2

allowBuilds:
  esbuild: true
  "@google/genai": false
  protobufjs: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@1.1.0"
  - "@earendil-works/pi-ai@1.1.0"
  - "@earendil-works/pi-coding-agent@1.1.0"
  - "@earendil-works/pi-telemetry@1.1.0"
  - "@earendil-works/pi-tui@1.1.0"
  - "@earendil-works/chord@1.1.0"
  - "@earendil-works/pi-codemode@1.1.0"
  - "@earendil-works/pi-mcp@1.1.0"
  - "@earendil-works/pi-durable@1.1.0"
  - "@modelcontextprotocol/sdk@1.32.1"
  - "zod@4.3.6"
